<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Пиксельная Ферма</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
</head>
<body>
  <div id="game-wrapper">
    <!-- Верхняя панель -->
    <header class="hud-top">
      <div class="hud-box">
        <span class="hud-label">💰</span>
        <span id="coinsVal" class="hud-value yellow">30</span>
      </div>
      <div class="hud-box">
        <span class="hud-label">🧺</span>
        <span id="cropCountVal" class="hud-value green">0</span>
      </div>
      <div class="hud-box level-box">
        <span class="hud-label">УР.<span id="levelVal">1</span></span>
        <div class="xp-bar"><div id="xpFill"></div></div>
      </div>
      <button id="shopBtn" class="pixel-btn shop-btn">🛒</button>
      <button id="settingsBtn" class="pixel-btn shop-btn">⚙️</button>
      <button id="sellBtn" class="pixel-btn sell-btn">💰 ПРОДАТЬ</button>
      <div class="quest-box">
        <div class="quest-top">
          <span id="questText" class="quest-text"></span>
          <span id="questReward" class="quest-reward"></span>
        </div>
        <div class="quest-bottom">
          <div class="quest-bar"><div id="questFill"></div></div>
          <span id="questCount" class="quest-count"></span>
        </div>
      </div>
    </header>

    <!-- Поле -->
    <main id="viewport">
      <canvas id="farmCanvas"></canvas>
    </main>

    <!-- Нижняя панель -->
    <footer class="hud-bottom">
      <div id="hint" class="hint-box">
        Выбери семена внизу и нажми на грядку. Когда вырастет — нажми ещё раз!
      </div>
      <div id="placeBanner" class="hint-box place-banner" style="display:none">
        <span id="placeText"></span>
        <button id="placeCancel" class="pixel-btn cancel-btn">ГОТОВО</button>
      </div>
      <div id="seedBar" class="seed-bar"></div>
    </footer>
  </div>

  <!-- Магазин улучшений -->
  <div id="shopModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">УЛУЧШЕНИЯ</span>
        <button id="shopClose" class="pixel-btn close-btn">✕</button>
      </div>
      <div id="upgradeList"></div>
    </div>
  </div>

  <!-- Настройки -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card settings-card">
      <div class="modal-head">
        <span class="modal-title">НАСТРОЙКИ</span>
        <button id="settingsClose" class="pixel-btn close-btn">✕</button>
      </div>
      <button id="soundBtn" class="pixel-btn settings-row settings-sound">🔊 ЗВУК: ВКЛ</button>
      <button id="resetBtn" class="pixel-btn settings-row settings-danger">🗑 НАЧАТЬ ЗАНОВО</button>
      <div id="resetConfirm" class="reset-confirm" style="display:none">
        Весь прогресс будет удалён. Это нельзя отменить. Начать игру заново?
        <div class="reset-row">
          <button id="resetYes" class="pixel-btn settings-danger">ДА, УДАЛИТЬ</button>
          <button id="resetNo" class="pixel-btn settings-sound">ОТМЕНА</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Всплывающее окно: возвращение, подарок дня -->
  <div id="popup" class="modal hidden">
    <div class="modal-card popup-card">
      <div id="popupTitle" class="modal-title"></div>
      <div id="popupBody" class="popup-body"></div>
      <button id="popupBtn" class="pixel-btn popup-btn">ОК</button>
    </div>
  </div>

  <script src="/sdk.js"></script>
  <script type="module" src="src/game.js"></script>
</body>
</html>
